<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title -->
  <text x="400" y="32" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Retrieval Efficiency Trade-off: Overlap@10 vs. Query Latency</text>
  <text x="400" y="50" font-size="12" fill="#94a3b8" text-anchor="middle">Exhaustive baseline vs. Champion Lists (r sweep) and Index Elimination (IDF sweep) across 70 turns</text>

  <!-- Axes Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3 3">
    
      <line x1="70" y1="339.2307692307692" x2="620" y2="339.2307692307692" />
      <text x="60" y="343.2307692307692" font-size="11" fill="#64748b" text-anchor="end">50%</text>
    
      <line x1="70" y1="288.46153846153845" x2="620" y2="288.46153846153845" />
      <text x="60" y="292.46153846153845" font-size="11" fill="#64748b" text-anchor="end">60%</text>
    
      <line x1="70" y1="237.69230769230768" x2="620" y2="237.69230769230768" />
      <text x="60" y="241.69230769230768" font-size="11" fill="#64748b" text-anchor="end">70%</text>
    
      <line x1="70" y1="186.9230769230769" x2="620" y2="186.9230769230769" />
      <text x="60" y="190.9230769230769" font-size="11" fill="#64748b" text-anchor="end">80%</text>
    
      <line x1="70" y1="136.15384615384613" x2="620" y2="136.15384615384613" />
      <text x="60" y="140.15384615384613" font-size="11" fill="#64748b" text-anchor="end">90%</text>
    
      <line x1="70" y1="85.38461538461536" x2="620" y2="85.38461538461536" />
      <text x="60" y="89.38461538461536" font-size="11" fill="#64748b" text-anchor="end">100%</text>
    
  </g>

  <!-- Axes lines -->
  <line x1="70" y1="60" x2="70" y2="390" stroke="#64748b" stroke-width="2" />
  <line x1="70" y1="390" x2="620" y2="390" stroke="#64748b" stroke-width="2" />

  <!-- Axis Labels -->
  <text x="345" y="435" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Latency (ms / query)</text>
  <text x="20" y="225" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle" transform="rotate(-90 20 225)">Overlap@10 vs. Exhaustive (%)</text>

  <!-- Champion Lists Line -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="2.5" points="105.1,295.7 157.9,236.2 203.3,150.7 268.1,113.0 322.0,95.5" />

  <!-- Data Points: Champion Lists -->
  
    <circle cx="105.05062446950376" cy="295.72153846153844" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <text x="113.05062446950376" y="289.72153846153844" font-size="10" fill="#7dd3fc" font-weight="600">r=50</text>
  
    <circle cx="157.91075542621485" cy="236.21999999999997" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <text x="165.91075542621485" y="230.21999999999997" font-size="10" fill="#7dd3fc" font-weight="600">r=100</text>
  
    <circle cx="203.28710440159944" cy="150.67384615384614" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <text x="211.28710440159944" y="144.67384615384614" font-size="10" fill="#7dd3fc" font-weight="600">r=250</text>
  
    <circle cx="268.08339396143884" cy="112.95230769230773" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <text x="276.08339396143884" y="106.95230769230773" font-size="10" fill="#7dd3fc" font-weight="600">r=500</text>
  
    <circle cx="321.98557051048647" cy="95.53846153846155" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <text x="329.98557051048647" y="89.53846153846155" font-size="10" fill="#7dd3fc" font-weight="600">r=1000</text>
  

  <!-- Data Points: Index Elimination -->
  
    <rect x="335.3634655026047" y="88.3553846153846" width="10" height="10" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <text x="348.3634655026047" y="105.3553846153846" font-size="10" fill="#fbbf24" font-weight="600">idf≥2.5</text>
  
    <rect x="224.62243846246983" y="142.78000000000003" width="10" height="10" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <text x="237.62243846246983" y="159.78000000000003" font-size="10" fill="#fbbf24" font-weight="600">idf≥3.5</text>
  
    <rect x="126.67015278282958" y="283.46153846153845" width="10" height="10" fill="#f59e0b" stroke="#0f172a" stroke-width="2" />
    <text x="139.67015278282958" y="300.46153846153845" font-size="10" fill="#fbbf24" font-weight="600">idf≥4.5</text>
  

  <!-- Data Point: Exhaustive Default -->
  <circle cx="528.3333333333333" cy="85.38461538461536" r="7" fill="#10b981" stroke="#f8fafc" stroke-width="2" />
  <text x="538.3333333333333" y="89.38461538461536" font-size="11" fill="#34d399" font-weight="700">Exhaustive Default</text>

  <!-- Legend -->
  <g transform="translate(640, 60)">
    <rect x="0" y="0" width="150" height="130" fill="#1e293b" rx="6" stroke="#334155" />
    <text x="12" y="22" font-size="12" font-weight="700" fill="#f8fafc">Configuration</text>
    
    <circle cx="20" cy="45" r="5" fill="#10b981" stroke="#f8fafc" stroke-width="1.5" />
    <text x="32" y="49" font-size="11" fill="#e2e8f0">Exhaustive (100%)</text>
    
    <circle cx="20" cy="75" r="5" fill="#38bdf8" />
    <text x="32" y="79" font-size="11" fill="#e2e8f0">Champion (r sweep)</text>
    
    <rect x="15" y="99" width="10" height="10" fill="#f59e0b" />
    <text x="32" y="108" font-size="11" fill="#e2e8f0">Index Elim (IDF)</text>
  </g>
</svg>