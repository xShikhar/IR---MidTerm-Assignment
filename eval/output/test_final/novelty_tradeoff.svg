<svg width="720" height="380" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: Inter, system-ui, sans-serif;">
  <text x="360" y="32" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Seen-Passage Penalty Trade-Off: A3 (Beta=0) vs. A4 (Beta=0.30)</text>

  <!-- Group A3 -->
  <g transform="translate(153, 0)">
    <text x="80" y="345" font-size="13" font-weight="600" text-anchor="middle" fill="#1e293b">A3: Headline (No Penalty)</text>
    <!-- Novelty Bar -->
    <rect x="20" y="157.5" width="50" height="162.5" fill="#3b82f6" rx="4" />
    <text x="45" y="149.5" font-size="11" font-weight="600" text-anchor="middle" fill="#1e40af">0.625</text>
    <text x="45" y="362" font-size="10" text-anchor="middle" fill="#64748b">Novelty@10</text>
    <!-- P@10 Bar -->
    <rect x="90" y="91.19999999999999" width="50" height="228.8" fill="#10b981" rx="4" />
    <text x="115" y="83.19999999999999" font-size="11" font-weight="600" text-anchor="middle" fill="#065f46">0.880</text>
    <text x="115" y="362" font-size="10" text-anchor="middle" fill="#64748b">P@10</text>
  </g>

  <!-- Group A4 -->
  <g transform="translate(419.59999999999997, 0)">
    <text x="80" y="345" font-size="13" font-weight="600" text-anchor="middle" fill="#1e293b">A4: Seen-Penalty (Beta=0.30)</text>
    <!-- Novelty Bar -->
    <rect x="20" y="122.4" width="50" height="197.6" fill="#8b5cf6" rx="4" />
    <text x="45" y="114.4" font-size="11" font-weight="600" text-anchor="middle" fill="#5b21b6">0.760</text>
    <text x="45" y="362" font-size="10" text-anchor="middle" fill="#64748b">Novelty@10</text>
    <!-- P@10 Bar -->
    <rect x="90" y="103.54999999999998" width="50" height="216.45000000000002" fill="#10b981" rx="4" />
    <text x="115" y="95.54999999999998" font-size="11" font-weight="600" text-anchor="middle" fill="#065f46">0.833</text>
    <text x="115" y="362" font-size="10" text-anchor="middle" fill="#64748b">P@10</text>
  </g>

  <!-- Y-Axis Baseline -->
  <line x1="60" y1="320" x2="680" y2="320" stroke="#9ca3af" stroke-width="1.5" />
</svg>